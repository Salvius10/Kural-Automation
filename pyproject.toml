[project]
name = "kural-voice-agent"
version = "0.1.0"
description = "A local, single-user, voice-input browser agent built on jev-ultrafast."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "browser-harness==0.1.13",
    "httpx[http2]>=0.28,<1",
    "pydantic>=2.9,<3",
    "orjson>=3.10,<4",
    "pyyaml>=6,<7",
    "dateparser>=1.2,<2",
    "rapidfuzz>=3.10,<4",
    "starlette>=0.41,<1",
    "uvicorn>=0.32,<1",
    "websockets>=13,<16",
    "pynput>=1.7,<2",
    "sounddevice>=0.5,<1",
    "numpy>=2,<3",
    "uvloop>=0.21,<1; sys_platform != 'win32'",
]

[project.scripts]
kural = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "core", "voice", "ui"]

[dependency-groups]
dev = ["pytest>=8.4,<9", "pytest-asyncio>=0.24,<2", "ruff>=0.14,<1"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
